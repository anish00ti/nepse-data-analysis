name: NEPSE Daily Report

on:
  workflow_dispatch:
  schedule:
    # Example: 12:15 UTC. Adjust for the desired Nepal time.
    - cron: "15 12 * * 1-5"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: python scripts/run_daily_report.py
